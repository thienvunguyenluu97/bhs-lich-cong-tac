<div id="lc-app">
  <div class="lc-header"><h2 class="lc-h">LỊCH CÔNG TÁC BHS</h2></div>

  <!-- ===== [MỚI 1/5] Nút tải Excel (ẩn cho tới khi có dữ liệu) ===== -->
  <div class="lc-tools">
    <button type="button" class="lc-button" data-lc="dl" hidden>⬇ Tải file Excel</button>
  </div>
  <!-- ===== HẾT [MỚI 1/5] ===== -->

  <div data-lc="result"></div>
  <div class="lc-status" data-lc="status" aria-live="polite"></div>
</div>

<style>
  #lc-app {
    --p: #00a4d6;
    --pd: #008fc0;
    --l: #e8f7fc;
    --bg: #f8fbfd;
    --b: #b9e5f5;
    --t: #333;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--t);
    background: var(--bg);
    border: 1px solid var(--b);
    border-radius: 12px;
    padding: 20px;
    max-width: 100%;
    line-height: 1.5;
    box-sizing: border-box;
  }
  #lc-app * {
    box-sizing: border-box;
  }
  #lc-app .lc-header {
    border-bottom: 3px solid var(--p);
    padding-bottom: 10px;
    margin-bottom: 12px;
  }
  #lc-app .lc-h {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    color: var(--pd);
    letter-spacing: 0.02em;
    text-align: center;
  }
  #lc-app .lc-status {
    margin: 8px 0;
    font-size: 14px;
    color: #555;
    min-height: 20px;
    text-align: center;
  }
  #lc-app .lc-error {
    color: #b3261e;
  }
  #lc-app .lc-button {
    height: 36px;
    padding: 0 16px;
    border: 0;
    border-radius: 8px;
    background: var(--p);
    color: #fff;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  #lc-app .lc-button:hover {
    background: var(--pd);
  }

  /* ===== [MỚI 2/5] CSS cho nút tải Excel ===== */
  #lc-app .lc-tools {
    text-align: right;
    margin-bottom: 8px;
  }
  #lc-app .lc-button:disabled {
    opacity: 0.6;
    cursor: wait;
  }
  /* ===== HẾT [MỚI 2/5] ===== */

  #lc-app .lc-title {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    color: var(--pd);
  }
  #lc-app .lc-sub {
    margin: 2px 0 12px;
    color: #000000;
    font-weight: 600;
    font-weight: bold;
    text-align: center;
  }
  #lc-app .lc-wrap {
    overflow-x: auto;
    border: 1px solid var(--b);
    border-radius: 10px;
    background: #fff;
  }
  #lc-app .lc-table {
    width: 100%;
    min-width: 980px;
    border-collapse: collapse;
    font-size: 14px;
  }
  #lc-app .lc-table th {
   background: var(--l);
  color: var(--pd);
  text-align: center; /* trước là left */
  vertical-align: middle;
  padding: 10px;
  border-bottom: 1px solid var(--b);
  white-space: nowrap;
  }
  #lc-app .lc-table td {
     padding: 10px;
  border-bottom: 1px solid #e3f2f8;
  vertical-align: middle; /* trước là top */
  }
  #lc-app .lc-table tr:hover td {
    filter: brightness(0.96);
  }
  #lc-app .lc-table tr td {
    background: var(--lc-bg, #fff);
  }
  #lc-app .lc-table tr.lc-newday td {
    border-top: 2px solid var(--b);
  }
  #lc-app .lc-nowrap {
    white-space: nowrap;
    font-weight: bold;
    text-align: center;
  }
  #lc-app .lc-empty {
    padding: 28px;
    text-align: center;
    background: #fff;
    border: 1px dashed var(--b);
    border-radius: 10px;
    color: #555;
  }
  @media (max-width: 760px) {
    #lc-app {
      padding: 12px;
    }
  }
</style>

<script>
  (function () {
    "use strict";
    const LC_CONFIG = {
      API_URL:
        "https://script.google.com/macros/s/AKfycbzItjJCnh3jYjfhdX7xChn5vry3ygPjIHU8qIEjj26_4kTcULMLs9NqN4oCX6WakoPU/exec", // URL Web App kết thúc bằng /exec
      TIMEOUT_MS: 20000,
    };
    const root = document.getElementById("lc-app");
    if (!root) return;
    const $ = (k) => root.querySelector('[data-lc="' + k + '"]');

    // [SỬA 3/5] thêm dl: $("dl") để lấy nút tải Excel
    const ui = { status: $("status"), result: $("result"), dl: $("dl") };

    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    };
    const fmt = (iso) => {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
      return m ? m[3] + "/" + m[2] + "/" + m[1] : iso || "";
    };

    // Gọi API qua JSONP (ổn định khi nhúng trong blog, không vướng CORS)
    window.LichCongTacApp = window.LichCongTacApp || {};
    const cbs = (window.LichCongTacApp._cb = {});
    let seq = 0;
    function api(params) {
      return new Promise((resolve, reject) => {
        const name = "c" + ++seq,
          s = document.createElement("script");
        const done = () => {
          clearTimeout(timer);
          delete cbs[name];
          s.remove();
        };
        const timer = setTimeout(() => {
          done();
          reject(new Error("timeout"));
        }, LC_CONFIG.TIMEOUT_MS);
        cbs[name] = (res) => {
          done();
          res && res.ok ? resolve(res.data) : reject(new Error("api"));
        };
        s.onerror = () => {
          done();
          reject(new Error("network"));
        };
        const q = new URLSearchParams(
          Object.assign({}, params, { callback: "LichCongTacApp._cb." + name }),
        );
        s.src =
          LC_CONFIG.API_URL +
          (LC_CONFIG.API_URL.indexOf("?") > -1 ? "&" : "?") +
          q;
        document.head.appendChild(s);
      });
    }

    function setStatus(text, isError, retry) {
      ui.status.textContent = text || "";
      ui.status.className = "lc-status" + (isError ? " lc-error" : "");
      if (retry) {
        ui.status.appendChild(document.createTextNode(" "));
        const b = el("button", "lc-button", "Thử lại");
        b.type = "button";
        b.onclick = retry;
        ui.status.appendChild(b);
      }
    }

    // Màu nền theo tổ: nhận diện bằng từ khóa (bỏ dấu, không phân biệt hoa thường). Thêm dòng mới để thêm tổ.
    // Tổ không có trong danh sách vẫn được tô một màu cố định (tính từ tên), không bị trắng.
    const TEAM_COLORS = [
      [/tc-hc|tchc|to chuc|hanh chinh|ke toan/, "#d1e5eb"], // P.TC-HC-KT
  [/giam hieu|\bbgh\b/, "#fef9c3"],                      // BGH
  [/toan/, "#dbeafe"],                                   // Tổ Toán tin
  [/khxh|xa hoi/, "#fde7d3"],                            // Tổ KHXH
  [/khtn|tu nhien/, "#e0e7ff"],                          // Tổ KHTN
  [/tieng anh/, "#ffe4e6"],                              // Tổ Tiếng Anh
  [/tieu hoc|\bth\b/, "#dcfce7"],                        // Tổ Tiểu Học
    ];
    const FALLBACK_COLORS = [
      "#f3e8ff",
      "#cffafe",
      "#fae8ff",
      "#ecfccb",
      "#e0e7ff",
      "#ffe4e6",
    ];
    function teamColor(name) {
      const t = String(name || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/gi, "d")
        .toLowerCase()
        .trim();
      if (!t) return "";
      for (const [re, color] of TEAM_COLORS) if (re.test(t)) return color;
      let h = 0;
      for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
      return FALLBACK_COLORS[h % FALLBACK_COLORS.length];
    }

    // =====================================================================
    // [MỚI 4/5] TÍNH NĂNG TẢI FILE EXCEL (dùng ExcelJS, tải từ cdnjs khi bấm nút)
    // =====================================================================
    let lastData = null; // lưu dữ liệu tuần đang hiển thị để xuất Excel
    const EXCELJS_URL =
      "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";

    function loadExcelJS() {
      return new Promise((res, rej) => {
        if (window.ExcelJS) return res();
        const sc = document.createElement("script");
        sc.src = EXCELJS_URL;
        sc.onload = res;
        sc.onerror = () => rej(new Error("exceljs"));
        document.head.appendChild(sc);
      });
    }

    async function downloadExcel() {
      const d = lastData;
      if (!d || !d.items || !d.items.length) return;
      const btn = ui.dl,
        old = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Đang tạo file...";
      try {
        await loadExcelJS();
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet("Tuần " + (d.week || ""), {
          views: [{ state: "frozen", ySplit: 3 }], // freeze 3 dòng đầu
          pageSetup: {
            orientation: "landscape", // in ngang
            fitToPage: true,
            fitToWidth: 1,
            fitToHeight: 0,
          },
        });

        const heads = [
          "STT",
          "Ngày",
          "Thứ",
          "Thời gian",
          "Nội dung chính",
          "Nội dung chi tiết",
          "Chủ trì",
          "Thành phần",
          "Địa điểm",
          "Tổ/Bộ phận",
          "Ghi chú",
        ];
        // Độ rộng cột (sửa số ở đây nếu muốn rộng/hẹp hơn)
        const widths = [6, 12, 10, 11, 28, 45, 12, 26, 16, 16, 18];
        ws.columns = widths.map((w) => ({ width: w }));

        const side = { style: "thin", color: { argb: "FFB9E5F5" } };
        const border = { top: side, left: side, bottom: side, right: side };
        const BLUE = "FF008FC0";

        // Dòng 1: tiêu đề (lấy đúng chữ đang hiện trên web)
        ws.mergeCells(1, 1, 1, heads.length);
        const t = ws.getCell(1, 1);
        t.value = root.querySelector(".lc-h").textContent;
        t.font = { bold: true, size: 16, color: { argb: BLUE } };
        t.alignment = { horizontal: "center", vertical: "middle" };
        ws.getRow(1).height = 30;

        // Dòng 2: Từ ngày ... Đến ngày ...
        ws.mergeCells(2, 1, 2, heads.length);
        const sub = ws.getCell(2, 1);
        sub.value = "Từ " + fmt(d.start) + " Đến " + fmt(d.end);
        sub.font = { bold: true, size: 12 };
        sub.alignment = { horizontal: "center", vertical: "middle" };
        ws.getRow(2).height = 22;

        // Dòng 3: tiêu đề cột
        const hr = ws.getRow(3);
        heads.forEach((h, i) => {
          const c = hr.getCell(i + 1);
          c.value = h;
          c.font = { bold: true, color: { argb: BLUE } };
          c.fill = {
            type: "pattern",
            pattern: "solid",
            fgColor: { argb: "FFE8F7FC" },
          };
          c.border = border;
          c.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
        });
        hr.height = 24;

        // Dữ liệu từ dòng 4 trở đi
        d.items.forEach((it, i) => {
          const row = ws.addRow(
            [
              i + 1,
              fmt(it.date),
              it.dow,
              it.time,
              it.title,
              it.detail,
              it.chair,
              it.attendees,
              it.place,
              it.dept,
              it.note,
            ].map((v) => (v == null ? "" : v)),
          );
          const bg = teamColor(it.dept); // cùng màu theo tổ như trên web
          row.eachCell({ includeEmpty: true }, (c, col) => {
            c.border = border;
            c.alignment = {
              vertical: "middle",
              wrapText: true,
              horizontal: col <= 4 ? "center" : "left",
            };
            if (col <= 4) c.font = { bold: true }; // 4 cột đầu in đậm như web
            c.fill = {
              type: "pattern",
              pattern: "solid",
              fgColor: {
                argb: bg ? "FF" + bg.slice(1).toUpperCase() : "FFFFFFFF",
              },
            };
          });
        });

        // Xuất file và tải về
        const buf = await wb.xlsx.writeBuffer();
        const blob = new Blob([buf], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "Lich_cong_tac_BHS_Tuan_" + (d.week || "") + ".xlsx";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      } catch (e) {
        setStatus("Không tạo được file Excel. Vui lòng thử lại.", true);
      } finally {
        btn.disabled = false;
        btn.textContent = old;
      }
    }
    ui.dl.onclick = downloadExcel;
    // =====================================================================
    // HẾT [MỚI 4/5]
    // =====================================================================

    function render(d) {
      // ===== [MỚI 5/5] lưu dữ liệu + hiện/ẩn nút tải Excel =====
      lastData = d;
      ui.dl.hidden = !(d.items && d.items.length);
      // ===== HẾT [MỚI 5/5] =====

      ui.result.innerHTML = "";
      root.querySelector(".lc-h").textContent =
        "LỊCH CÔNG TÁC BHS" +
        (d.week ? " TUẦN " + d.week : "") +
        (d.year ? " - NĂM HỌC " + d.year : ""); // tiêu đề lấy từ CAI_DAT
      ui.result.appendChild(
        el(
          "div",
          "lc-sub",
          " Từ " + fmt(d.start) + " Đến " + fmt(d.end),
        ),
      );
      if (!d.items.length) {
        ui.result.appendChild(
          el("div", "lc-empty", "Không có lịch công tác trong tuần này."),
        );
        return;
      }
      const wrap = el("div", "lc-wrap"),
        table = el("table", "lc-table"),
        head = el("tr");
      [
        "STT",
        "Ngày",
        "Thứ",
        "Thời gian",
        "Nội dung chính",
        "Nội dung chi tiết",
        "Chủ trì",
        "Thành phần",
        "Địa điểm",
        "Tổ/Bộ phận",
        "Ghi chú",
      ].forEach((h) => head.appendChild(el("th", "", h)));
      const thead = el("thead");
      thead.appendChild(head);
      table.appendChild(thead);
      const tb = el("tbody");
      let prev = "";
      d.items.forEach((it, i) => {
        const tr = el("tr", it.date !== prev && i ? "lc-newday" : "");
        prev = it.date;
        const bg = teamColor(it.dept);
        if (bg) tr.style.setProperty("--lc-bg", bg);
        [
          i + 1,
          fmt(it.date),
          it.dow,
          it.time,
          it.title,
          it.detail,
          it.chair,
          it.attendees,
          it.place,
          it.dept,
          it.note,
        ].forEach((v, c) =>
          tr.appendChild(el("td", c < 4 ? "lc-nowrap" : "", v)),
        );
        tb.appendChild(tr);
      });
      table.appendChild(tb);
      wrap.appendChild(table);
      ui.result.appendChild(wrap);
    }

    // Tuần hiện tại do backend xác định từ TUAN_HOC (giờ Việt Nam)
    async function loadCurrent() {
      if (/^DÁN_/.test(LC_CONFIG.API_URL)) {
        setStatus("Chưa cấu hình API_URL.", true);
        return;
      }
      ui.result.innerHTML = "";
      setStatus("Đang tải dữ liệu...");
      try {
        const d = await api({ action: "getCurrentWeek" });
        if (
          !d ||
          !Array.isArray(d.items) ||
          !/^\d{4}-\d{2}-\d{2}$/.test(d.start)
        )
          throw new Error("bad");
        render(d);
        setStatus(
          (d.items.length ? d.items.length + " lịch công tác" : "") +
            (d.updated
              ? (d.items.length ? " • " : "") +
                "Cập nhật lần cuối: " +
                d.updated
              : ""),
        );
      } catch (e) {
        setStatus(
          "Không thể tải dữ liệu. Vui lòng thử lại.",
          true,
          loadCurrent,
        );
      }
    }

    Object.assign(window.LichCongTacApp, { init: loadCurrent, loadCurrent });
    loadCurrent();
  })();
</script>
